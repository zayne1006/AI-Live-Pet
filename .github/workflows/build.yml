name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          chmod +x /opt/gradle-8.7/bin/gradle
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          echo y | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager platform-tools platforms;android-34 build-tools;34.0.0
      - name: Write local.properties
        run: echo sdk.dir=$HOME/android-sdk > local.properties
      - name: Generate Gradle Wrapper
        run: /opt/gradle-8.7/bin/gradle --no-daemon wrapper --gradle-version 8.7
      - name: Build APK
        env:
          ANDROID_HOME: $HOME/android-sdk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/build.log
          echo APK FILES FOUND:
          find app/build/outputs/apk -name *.apk -type f
          ls -la app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
